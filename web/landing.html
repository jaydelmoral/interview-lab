<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interview Lab</title>
<meta name="color-scheme" content="dark light">
<script src="/theme.js"></script>
<link rel="preload" href="/fonts/Outfit-latin-400-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/common.css">
</head>
<body class="landing">
<div id="appbar"></div>
<div class="wrap">

  <div class="orbit-layer iso-only" aria-hidden="true">
    <div class="orbit-stage">
      <div class="orbit-glow"></div>
      <svg class="orbit" viewBox="0 0 480 480" focusable="false">
        <g class="arc arc-a"><use href="#oA" fill="url(#gA)"/><path class="glint" d="M19.05 309.84A226 226 0 0 1 19.05 170.16" fill="none" stroke="url(#gG)" stroke-width="4" stroke-linecap="round"/></g>
        <g class="arc arc-b"><use href="#oB" fill="url(#gB)"/></g>
        <g class="arc arc-c"><use href="#oC" fill="url(#gC)"/></g>
      </svg>
    </div>
  </div>

  <section class="hero" id="inicio">
    <div>
      <span class="eyebrow"><i></i><span data-t="heroBadge"></span></span>
      <h1><span data-t="heroT1"></span> <em data-t="heroEm"></em><span data-t="heroT3"></span></h1>
      <p class="lead" data-t="heroSub"></p>
      <div class="row">
        <a class="btn primary lg" href="#crear" data-t="ctaBuild"></a>
        <a class="btn lg" href="#evaluacion" data-t="ctaEval"></a>
      </div>
      <div class="facts">
        <div><b>100 %</b><span data-t="fact1"></span></div>
        <div><b id="factMods">–</b><span data-t="fact2"></span></div>
        <div><b id="factItems">–</b><span data-t="fact3"></span></div>
        <div><b>ES · EN</b><span data-t="fact4"></span></div>
      </div>
    </div>
  </section>

  <section class="section" id="evaluacion">
    <div class="section-head"><span class="eyebrow" data-t="evalEyebrow"></span><h2 data-t="evalTitle"></h2><p data-t="evalSub"></p></div>
    <div id="sampleDash"></div>
    <div class="how-grid" id="criteria"></div>
  </section>

  <section class="section" id="porque">
    <span id="pilares" class="anchor-alias"></span>
    <div class="section-head"><span class="eyebrow" data-t="whyEyebrow"></span><h2 id="whyTitle" data-t="pilTitle"></h2><p data-t="pilSub"></p></div>
    <div class="reasons">
      <nav class="reasons-nav" aria-labelledby="whyTitle">
        <a href="#w1" class="active" data-t="p1t"></a><a href="#w2" data-t="p3t"></a><a href="#w3" data-t="p4t"></a><a href="#w4" data-t="p2t"></a>
      </nav>
      <div class="reasons-panels">
        <article id="w1"><div class="mini"><span class="eyebrow" data-t="w1tag"></span><div class="chips reveal" id="detectChips"></div></div>
          <h3 data-t="w1h"></h3><p data-t="p1p"></p></article>
        <article id="w2"><div class="mini"><div class="mterm reveal" id="termLines"></div></div>
          <h3 data-t="w2h"></h3><p data-t="p3p"></p></article>
        <article id="w3"><div class="mini reveal" id="timeBars"></div>
          <h3 data-t="w3h"></h3><p data-t="p4p"></p></article>
        <article id="w4"><div class="mini"><div class="mflow reveal"><span data-t="flowBrowser"></span><em>⇄</em><span>127.0.0.1</span><em>⇄</em><span data-t="flowFiles"></span></div>
          <p class="mnote" data-t="flowNote"></p></div>
          <h3 data-t="w4h"></h3><p data-t="p2p"></p></article>
      </div>
    </div>
  </section>

  <section class="section" id="pasos">
    <span id="como" class="anchor-alias"></span>
    <div class="section-head"><span class="eyebrow" data-t="howEyebrow"></span><h2 data-t="stepsTitle"></h2><p data-t="stepsSub"></p></div>
    <div class="arcsteps">
      <article class="card"><svg class="iso-only" viewBox="0 0 480 480" aria-hidden="true" focusable="false"><use href="#oA" fill="url(#gA)"/><use class="dim" href="#oB" fill="url(#gB)"/><use class="dim" href="#oC" fill="url(#gC)"/></svg>
        <small><span data-t="stepWord"></span> 1</small><h3 data-t="s1t"></h3><p data-t="s1p"></p></article>
      <article class="card"><svg class="iso-only" viewBox="0 0 480 480" aria-hidden="true" focusable="false"><use class="dim" href="#oA" fill="url(#gA)"/><use href="#oB" fill="url(#gB)"/><use class="dim" href="#oC" fill="url(#gC)"/></svg>
        <small><span data-t="stepWord"></span> 2</small><h3 data-t="s2t"></h3><p data-t="s2p"></p></article>
      <article class="card"><svg class="iso-only" viewBox="0 0 480 480" aria-hidden="true" focusable="false"><use class="dim" href="#oA" fill="url(#gA)"/><use class="dim" href="#oB" fill="url(#gB)"/><use href="#oC" fill="url(#gC)"/></svg>
        <small><span data-t="stepWord"></span> 3</small><h3 data-t="s3t"></h3><p data-t="s3p"></p></article>
    </div>
  </section>

  <section class="section" id="crear">
    <div class="section-head"><span class="eyebrow" data-t="buildEyebrow"></span><h2 data-t="title"></h2><p data-t="sub"></p></div>

    <section class="card" id="c1">
      <h2 data-t="h1"></h2>
      <div class="row" style="margin-top:0">
        <label><input type="radio" name="kind" value="jd" checked> <span data-t="kindJd"></span></label>
        <label><input type="radio" name="kind" value="cv"> <span data-t="kindCv"></span></label>
      </div>
      <textarea id="src" data-tp="srcPh" spellcheck="false" style="margin-top:12px"></textarea>
      <div class="row">
        <input type="file" id="file" accept=".txt,.md,.docx,.pdf">
        <button class="primary" id="analyzeBtn" data-t="analyze"></button>
        <span class="muted" id="analyzeMsg"></span>
      </div>
      <p class="muted" data-t="privacy"></p>
      <div id="found"></div>
    </section>

    <section class="card" id="c2">
      <h2 data-t="h2"></h2>
      <div class="grid">
        <div class="field"><label data-t="fSeniority"></label>
          <select id="seniority"><option value="jr">Junior</option><option value="mid">Mid</option><option value="sr">Senior</option><option value="staff">Staff</option><option value="principal">Principal</option></select></div>
        <div class="field"><label data-t="fLanguage"></label>
          <select id="language"><option value="java">Java</option><option value="python">Python</option><option value="other" data-t="optOther"></option></select></div>
        <div class="field"><label data-t="fVersion"></label><select id="version"></select></div>
        <div class="field"><label data-t="fPace"></label>
          <select id="pace"><option value="tight" data-t="paceTight"></option><option value="standard" data-t="paceStd" selected></option><option value="relaxed" data-t="paceRelax"></option></select></div>
        <div class="field"><label data-t="fTitle"></label><input id="title" data-tp="titlePh" maxlength="80"></div>
      </div>
      <div class="note" id="langNote" style="display:none"></div>
      <p class="muted" id="runtimeNote"></p>
      <h2 style="margin-top:22px" data-t="fModules"></h2>
      <div class="grid" id="modules"></div>
      <p class="muted" data-t="timers"></p>
    </section>

    <section class="card" id="c3">
      <h2 data-t="h3"></h2>
      <p class="muted" data-t="bankHelp"></p>
      <div class="grid">
        <div class="field"><label data-t="fLinks"></label><textarea id="links" style="min-height:110px" data-tp="linksPh" spellcheck="false"></textarea></div>
        <div class="field"><label data-t="fNotes"></label><textarea id="notes" style="min-height:110px" data-tp="notesPh"></textarea></div>
      </div>
      <div class="row">
        <input id="bankTitle" data-tp="bankTitlePh" maxlength="80" style="min-width:240px">
        <button id="bankBtn" data-t="bankAdd"></button>
        <span class="muted" id="bankMsg"></span>
      </div>
      <div class="note" data-t="bankNote"></div>
      <div class="note" id="genNote"></div>
      <div class="list" id="banks"></div>
    </section>

    <section class="card">
      <div class="row" style="margin-top:0">
        <button class="primary lg" id="createBtn" data-t="create"></button>
        <span class="muted" id="createMsg"></span>
      </div>
    </section>

    <section class="card" id="c4" style="display:none">
      <h2 data-t="h4"></h2>
      <div class="list" id="exams"></div>
    </section>
  </section>

  <section class="cta-final" id="cierre">
    <small id="tagline"></small>
    <h2 data-t="ctaFinalTitle"></h2>
    <p data-t="ctaFinalSub"></p>
    <div class="row"><a class="btn primary lg" href="#crear" data-t="ctaBuild"></a></div>
  </section>
</div>
<div id="tip"></div>
<footer id="foot"></footer>
<script src="/common.js"></script>
<script src="/landing.js"></script>
</body>
</html>
