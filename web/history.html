<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interview Lab · Historial</title>
<meta name="color-scheme" content="dark light">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/common.css">
</head>
<body>
<div id="appbar"></div>
<div class="wrap">
  <div class="section-head" style="margin-top:12px">
    <span class="eyebrow" data-t="eyebrow"></span>
    <h2 data-t="title"></h2>
    <p data-t="sub"></p>
  </div>
  <div id="root"></div>
</div>
<div id="tip"></div>
<footer id="foot"></footer>
<script src="/common.js"></script>
<script>
addStrings({
  es: {
    eyebrow: 'Historial', title: 'Tu progreso en el tiempo', sub: 'Todo se guarda en tu equipo (SQLite). Aquí ves tendencias, módulos débiles y cada simulacro anterior.',
    emptyT: 'Aún no hay historial', emptyP: 'Termina un simulacro o envía un ejercicio de código y aquí aparecerán tus estadísticas.', emptyCta: 'Crear un simulacro',
    kRuns: 'Simulacros terminados', kAvg: 'Promedio global', kBest: 'Mejor resultado', kLast: 'Último resultado', kTime: 'Tiempo practicado', kAttempts: 'Envíos de código y quiz', kStreak: 'Racha de días', kDays: 'días activos',
    vsPrev: 'vs. los 3 anteriores', first: 'primer simulacro', min: 'min', days: n => (n === 1 ? '1 día' : n + ' días'),
    trend: 'Resultado global por simulacro', modules: 'Evolución por módulo (los más débiles primero)', runsN: n => (n === 1 ? '1 vez' : n + ' veces'),
    avg: 'prom.', last: 'último', weak: 'Temas que más fallas', weakNone: 'Aún no hay preguntas falladas registradas.', times: n => (n === 1 ? '1 vez' : n + ' veces'),
    time: 'Tiempo usado vs. asignado, por módulo', code: 'Práctica de código y quiz', problem: 'Ejercicio', attempts: 'Intentos', best: 'Mejor', now: 'Último', improved: 'Cambio',
    recent: 'Simulacros recientes', date: 'Fecha', exam: 'Simulacro', result: 'Resultado', sections: 'Secciones', passed: 'aprobadas', detail: 'Detalle', hide: 'Ocultar',
    missed: 'Preguntas falladas en este simulacro', noMissed: 'No hay preguntas falladas registradas.', expected: 'Respuesta correcta', loading: 'Cargando…'
  },
  en: {
    eyebrow: 'History', title: 'Your progress over time', sub: 'Everything is stored on your machine (SQLite). Here you see trends, weak modules and every past simulation.',
    emptyT: 'No history yet', emptyP: 'Finish a simulation or submit a coding exercise and your statistics will show up here.', emptyCta: 'Build a simulation',
    kRuns: 'Simulations finished', kAvg: 'Overall average', kBest: 'Best result', kLast: 'Latest result', kTime: 'Practice time', kAttempts: 'Code and quiz submissions', kStreak: 'Day streak', kDays: 'active days',
    vsPrev: 'vs. the previous 3', first: 'first simulation', min: 'min', days: n => (n === 1 ? '1 day' : n + ' days'),
    trend: 'Overall result per simulation', modules: 'Evolution by module (weakest first)', runsN: n => (n === 1 ? '1 time' : n + ' times'),
    avg: 'avg', last: 'latest', weak: 'Topics you miss most', weakNone: 'No missed questions recorded yet.', times: n => (n === 1 ? '1 time' : n + ' times'),
    time: 'Time used vs. allotted, by module', code: 'Code and quiz practice', problem: 'Exercise', attempts: 'Attempts', best: 'Best', now: 'Latest', improved: 'Change',
    recent: 'Recent simulations', date: 'Date', exam: 'Simulation', result: 'Result', sections: 'Sections', passed: 'passed', detail: 'Details', hide: 'Hide',
    missed: 'Questions missed in this simulation', noMissed: 'No missed questions recorded.', expected: 'Correct answer', loading: 'Loading…'
  }
});

let DATA = null;
const lv = p => (p >= 80 ? 'strong' : p >= 60 ? 'mid' : 'weak');
const fmt = (x, d = 0) => (x == null ? '—' : Number(x).toFixed(d).replace(/\.0+$/, ''));
const arrow = d => (d == null ? '<span class="flat">—</span>' : d > 0.5 ? `<span class="up">▲ ${fmt(d)}</span>` : d < -0.5 ? `<span class="down">▼ ${fmt(Math.abs(d))}</span>` : '<span class="flat">＝ 0</span>');

function spark(series){
  if (!series.length) return '';
  const w = 110, h = 30, n = series.length, x = i => (n === 1 ? w / 2 : 4 + i * (w - 8) / (n - 1)), y = v => h - 3 - (h - 6) * v / 100;
  const pts = series.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><line x1="0" x2="${w}" y1="${y(60)}" y2="${y(60)}" stroke="var(--line-strong)" stroke-dasharray="3 3"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(n - 1)}" cy="${y(series[n - 1])}" r="3" fill="var(--accent)"/></svg>`;
}
function trendChart(trend){
  const W = 760, H = 230, L = 36, R = 14, PT = 14, PB = 26, n = trend.length;
  const x = i => (n === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (n - 1)), y = v => PT + (H - PT - PB) * (1 - v / 100);
  const grid = [0, 25, 50, 75, 100].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('');
  const pass = `<line x1="${L}" x2="${W - R}" y1="${y(60)}" y2="${y(60)}" stroke="var(--accent)" stroke-dasharray="4 4" opacity=".7"/>`;
  const line = n > 1 ? `<polyline points="${trend.map((t, i) => x(i).toFixed(1) + ',' + y(t.overall).toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>` : '';
  const dots = trend.map((t, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(t.overall).toFixed(1)}" r="4.5" fill="var(--${lv(t.overall) === 'weak' ? 'bad' : lv(t.overall) === 'strong' ? 'ok' : 'accent'})"><title>${esc(t.when.slice(0, 16))} · ${esc(t.title)} · ${fmt(t.overall)}%</title></circle>`).join('');
  const lab = trend.length ? [0, n - 1].filter((v, i, a) => a.indexOf(v) === i).map(i => `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 && n > 1 ? 'start' : n === 1 ? 'middle' : 'end'}">${esc(trend[i].when.slice(0, 10))}</text>`).join('') : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T('trend'))}">${grid}${pass}${line}${dots}${lab}</svg>`;
}

function render(){
  const d = DATA, k = d.kpis, root = $('root');
  if (!k.runs && !k.attempts) {
    root.innerHTML = `<div class="card empty"><h3>${esc(T('emptyT'))}</h3><p class="muted">${esc(T('emptyP'))}</p><div class="row" style="justify-content:center"><a class="btn primary lg" href="/#crear">${esc(T('emptyCta'))}</a></div></div>`;
    return;
  }
  const kpi = (v, l, sub, cls = 's4') => `<div class="panel kpi ${cls}"><div class="v">${v}</div><div class="l">${esc(l)}${sub ? ' · ' + sub : ''}</div></div>`;
  const mods = d.modules.map(m => `<div class="mod-card"><b style="font-weight:500">${esc(m.title)}</b><span class="muted">${esc(T('runsN')(m.runs))}</span>${spark(m.series)}
      <span style="text-align:right;white-space:nowrap"><span class="t-${lv(m.avg)}">${T('avg')} ${fmt(m.avg)}%</span> · ${T('last')} ${fmt(m.last)}% ${arrow(m.delta)}</span></div>`).join('');
  const maxTag = Math.max(1, ...d.weak_tags.map(t => t.count));
  const weak = d.weak_tags.length ? d.weak_tags.map(t => `<div class="hrow" style="grid-template-columns:minmax(80px,1.2fr) 2fr auto"><span class="n" title="${esc(t.tag)}">${esc(t.tag)}</span>
      <div class="bar lv-weak"><i style="width:${Math.round(100 * t.count / maxTag)}%"></i></div><span class="p muted">${esc(T('times')(t.count))}</span></div>`).join('') : `<p class="muted">${esc(T('weakNone'))}</p>`;
  const times = d.modules.filter(m => m.avg_allotted).map(m => { const f = Math.round(100 * (m.avg_used || 0) / m.avg_allotted);
    return `<div class="hrow" style="grid-template-columns:minmax(96px,1.3fr) 1.5fr auto"><span class="n">${esc(m.title)}</span><div class="bar"><i style="width:${Math.min(100, f)}%;background:${f >= 95 ? 'var(--warn)' : 'var(--accent-2)'}"></i></div><span class="p muted">${fmt(m.avg_used, 1)}/${fmt(m.avg_allotted, 1)} ${esc(T('min'))}</span></div>`; }).join('');
  const code = d.code.length ? `<table class="tbl"><thead><tr><th>${esc(T('problem'))}</th><th>${esc(T('attempts'))}</th><th>${esc(T('best'))}</th><th>${esc(T('now'))}</th><th>${esc(T('improved'))}</th></tr></thead><tbody>${d.code.map(p =>
      `<tr><td>${esc(p.problem)}</td><td>${p.attempts}</td><td class="t-${lv(p.best)}">${fmt(p.best)}%</td><td>${fmt(p.last)}%</td><td>${arrow(p.improved)}</td></tr>`).join('')}</tbody></table>` : '';
  const recent = d.recent.length ? `<table class="tbl"><thead><tr><th>${esc(T('date'))}</th><th>${esc(T('exam'))}</th><th>${esc(T('result'))}</th><th>${esc(T('sections'))}</th><th></th></tr></thead><tbody>${d.recent.map(r =>
      `<tr class="click" data-run="${r.id}"><td>${esc(r.finished_at.slice(0, 16))}</td><td>${esc(r.title)}<br><span class="muted">${esc((r.seniority || '').toUpperCase())} ${esc(r.language || '')}${r.version ? ' ' + r.version : ''}</span></td>
      <td class="t-${lv(r.overall)}">${fmt(r.overall)}%</td><td>${r.sections_passed}/${r.sections_total} ${esc(T('passed'))}</td><td class="muted">${esc(T('detail'))} ›</td></tr><tr class="det" data-for="${r.id}" style="display:none"><td colspan="5"></td></tr>`).join('')}</tbody></table>` : '';
  root.innerHTML = `<div class="dash"><div class="dash-body">
    ${kpi(k.runs, T('kRuns'), '')}${kpi(fmt(k.avg_overall) + '%', T('kAvg'), k.delta == null ? '' : arrow(k.delta) + ' <span class="muted">' + esc(T('vsPrev')) + '</span>')}
    ${kpi(fmt(k.best_overall) + '%', T('kBest'), '')}${kpi(fmt(k.last_overall) + '%', T('kLast'), '')}
    ${kpi(fmt(k.minutes_used) + '<small>' + esc(T('min')) + '</small>', T('kTime'), '')}${kpi(k.attempts, T('kAttempts'), '')}
    ${kpi(esc(T('days')(k.streak_days)), T('kStreak'), '<span class="muted">' + k.active_days + ' ' + esc(T('kDays')) + '</span>')}
    ${k.runs ? `<div class="panel s12"><h4>${esc(T('trend'))}</h4>${trendChart(d.trend)}</div>` : ''}
    ${mods ? `<div class="panel s7"><h4>${esc(T('modules'))}</h4>${mods}</div>` : ''}
    <div class="panel s5"><h4>${esc(T('weak'))}</h4>${weak}${times ? `<h4 style="margin-top:24px">${esc(T('time'))}</h4>${times}` : ''}</div>
    ${code ? `<div class="panel s12"><h4>${esc(T('code'))}</h4>${code}</div>` : ''}
    ${recent ? `<div class="panel s12"><h4>${esc(T('recent'))}</h4>${recent}</div>` : ''}
  </div></div>`;
  root.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => toggleRun(tr.dataset.run));
}

async function toggleRun(id){
  const row = document.querySelector(`tr.det[data-for="${id}"]`), cell = row.firstElementChild;
  if (row.style.display !== 'none') { row.style.display = 'none'; return; }
  row.style.display = ''; cell.innerHTML = `<span class="muted">${esc(T('loading'))}</span>`;
  try {
    const r = await api('/api/history/runs/' + encodeURIComponent(id));
    const secs = r.sections.map(s => `<div class="hrow" style="grid-template-columns:minmax(110px,1.2fr) 3fr auto"><span class="n">${esc(s.title || s.module)}</span><div class="bar lv-${lv(s.pct)}"><i style="width:${Math.min(100, s.pct)}%"></i></div><span class="p t-${lv(s.pct)}">${fmt(s.pct)}%</span></div>`).join('');
    const miss = r.missed.length ? r.missed.map(m => `<details class="miss"><summary>${esc(m.section)} — ${esc(m.question)}</summary><p class="why-txt"><b>${esc(T('expected'))}:</b> ${esc(m.expected)}</p>${m.explanation ? `<p class="why-txt">${esc(m.explanation)}</p>` : ''}</details>`).join('') : `<p class="muted">${esc(T('noMissed'))}</p>`;
    cell.innerHTML = `<div style="padding:10px 4px">${secs}<h4 style="margin:18px 0 10px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)">${esc(T('missed'))}</h4>${miss}</div>`;
  } catch (e) { cell.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

function applyI18n(){
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T(el.dataset.t); });
  if (DATA) render();
}
(async function init(){
  await renderChrome('history', applyI18n);
  try { DATA = await api('/api/history'); } catch (e) { $('root').innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
  applyI18n();
})();
</script>
</body>
</html>
