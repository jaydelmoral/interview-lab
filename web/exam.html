<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interview Lab</title>
<meta name="color-scheme" content="dark light">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/common.css">
</head>
<body>
<div id="appbar"></div>
<div class="wrap">
  <div id="start" class="card" style="display:none"></div>
  <div id="runner" style="display:none">
    <div class="card">
      <div class="steps" id="steps"></div>
      <div class="row" style="margin-top:0;justify-content:space-between">
        <h3 id="secTitle" style="margin:0"></h3>
        <div class="row" style="margin:0"><span class="timer" id="timer">--:--</span><button id="finishBtn"></button></div>
      </div>
    </div>
    <div id="body"></div>
  </div>
  <div id="report" style="display:none"></div>
  <div id="fatal" class="card err" style="display:none"></div>
</div>
<div id="tip"></div>
<footer id="foot"></footer>
<script src="/common.js"></script>
<script src="/editor.js"></script>
<script src="/exam.js"></script>
</body>
</html>
