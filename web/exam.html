<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interview Lab</title>
<meta name="color-scheme" content="dark light">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/common.css">
</head>
<body>
<div id="appbar"></div>
<div class="wrap">
  <div id="start" class="card" style="display:none"></div>
  <div id="runner" style="display:none">
    <div class="card">
      <div class="steps" id="steps"></div>
      <div class="row" style="margin-top:0;justify-content:space-between">
        <h3 id="secTitle" style="margin:0"></h3>
        <div class="row" style="margin:0"><span class="timer" id="timer">--:--</span><button id="finishBtn"></button></div>
      </div>
    </div>
    <div id="body"></div>
  </div>
  <div id="report" style="display:none"></div>
  <div id="fatal" class="card err" style="display:none"></div>
</div>
<div id="tip"></div>
<footer id="foot"></footer>
<script src="/common.js"></script>
<script src="/editor.js"></script>
<script>
addStrings({
  es: {
    sections: 'Secciones', minutes: 'min', total: 'Tiempo total', begin: 'Comenzar', resume: 'Continuar donde iba', fresh: 'Empezar de nuevo', config: 'Configuración',
    finishSec: 'Terminar sección', finishConfirm: 'Terminar esta sección ahora?', timeUp: 'Se acabó el tiempo de la sección.', next: 'Siguiente sección', seeReport: 'Ver reporte final',
    results: 'Resultado de la sección', yourAnswer: 'Tu respuesta', check: 'Corregir', expected: 'Esperado', right: 'Correcto', wrong: 'Incorrecto', show: 'Mostrar respuesta',
    know: 'Lo sabía', dont: 'No lo sabía', submit: 'Enviar y calificar', reset: 'Restaurar plantilla', resetConfirm: '¿Borrar tu código y restaurar la plantilla?', running: 'Compilando y ejecutando pruebas…',
    noCompile: 'No compiló.', why: 'Por qué falló', how: 'Cómo mejorar', best: 'Mejor puntaje', problem: 'Ejercicio', loading: 'Cargando…',
    reportTitle: 'Reporte final', overall: 'Resultado global', perSection: 'Por sección', weak: 'Temas a reforzar', none: 'Sin temas débiles detectados.', review: 'Repasa', good: 'Bien',
    retake: 'Repetir este simulacro', another: 'Crear otro simulacro', notes: 'Avisos', notFound: 'No se encontró ese simulacro.', quizHint: 'Escribe exactamente lo que imprimirá el fragmento, o el nombre de la excepción.',
    multiHint: 'Elige todas las correctas', singleHint: 'Elige una', score: 'Puntaje',
    draft: 'Borrador', draftHint: 'Pregunta escrita con IA, aún sin revisión humana: contrástala con las fuentes antes de fiarte.', sourcesLbl: 'Fuentes'
  },
  en: {
    sections: 'Sections', minutes: 'min', total: 'Total time', begin: 'Start', resume: 'Resume where I left off', fresh: 'Start over', config: 'Settings',
    finishSec: 'Finish section', finishConfirm: 'Finish this section now?', timeUp: 'Section time is up.', next: 'Next section', seeReport: 'See final report',
    results: 'Section result', yourAnswer: 'Your answer', check: 'Check', expected: 'Expected', right: 'Correct', wrong: 'Incorrect', show: 'Show answer',
    know: 'I knew it', dont: 'I did not know it', submit: 'Submit and grade', reset: 'Restore template', resetConfirm: 'Delete your code and restore the template?', running: 'Compiling and running tests…',
    noCompile: 'It did not compile.', why: 'Why it failed', how: 'How to improve', best: 'Best score', problem: 'Exercise', loading: 'Loading…',
    reportTitle: 'Final report', overall: 'Overall result', perSection: 'By section', weak: 'Topics to reinforce', none: 'No weak topics detected.', review: 'Review', good: 'Good',
    retake: 'Retake this simulation', another: 'Create another simulation', notes: 'Notes', notFound: 'That simulation was not found.', quizHint: 'Write exactly what the snippet prints, or the exception name.',
    multiHint: 'Pick all correct answers', singleHint: 'Pick one', score: 'Score',
    draft: 'Draft', draftHint: 'AI-written question not yet reviewed by a human: check it against the sources before relying on it.', sourcesLbl: 'Sources'
  }
});

const params = new URLSearchParams(location.search);
const EID = params.get('id');
let secStart = 0;
let EXAM = null, idx = -1, RESULTS = [], WEAK = {}, endAt = 0, tick = null, answers = {}, codeBest = {}, codeIdx = 0, problemCache = {}, stmtMode = store('stmtMode') === 'es' ? 'es' : 'en', hoverOn = !!store('hoverOn');
const progKey = () => 'exam:' + EID;
const saveProg = () => store(progKey(), {idx, RESULTS, WEAK, endAt});

function fatal(msg){ $('fatal').style.display = ''; $('fatal').textContent = msg; }

async function load(){
  try { EXAM = await api('/api/exams/' + encodeURIComponent(EID) + '?lang=' + lang); }
  catch (e) { return fatal(T('notFound')); }
  document.title = EXAM.title ? EXAM.title + ' · Interview Lab' : 'Interview Lab';
  showStart();
}

function modeLabel(c){ return `${c.seniority.toUpperCase()} · ${c.language}${c.version ? (c.language === 'java' ? ' ' + c.version : ' 3.' + c.version) : ''}`; }
function showStart(){
  $('runner').style.display = 'none'; $('report').style.display = 'none';
  const prog = store(progKey());
  const canResume = prog && prog.idx >= 0 && prog.idx < EXAM.sections.length;
  const rows = EXAM.sections.map((s, i) => `<div class="item"><div><b>${i + 1}. ${esc(s.title)}</b> <span class="muted">· ${s.items.length}</span></div><span class="muted">${s.minutes} ${esc(T('minutes'))}</span></div>`).join('');
  $('start').style.display = '';
  $('start').innerHTML = `<h2>${esc(T('config'))}</h2>${EXAM.title ? '<h3>' + esc(EXAM.title) + '</h3>' : ''}<p class="muted">${esc(modeLabel(EXAM.config))} · ${esc(T('total'))}: <b>${EXAM.total_minutes} ${esc(T('minutes'))}</b></p>
    <div class="list">${rows}</div>
    ${EXAM.notes.length ? `<div class="note"><b>${esc(T('notes'))}:</b> ${esc(EXAM.notes.map(n => n.text).join(' '))}</div>` : ''}
    <div class="row"><button class="primary" id="beginBtn">${esc(canResume ? T('resume') : T('begin'))}</button>${canResume ? `<button id="freshBtn">${esc(T('fresh'))}</button>` : ''}</div>`;
  $('beginBtn').onclick = () => { if (canResume) { RESULTS = prog.RESULTS || []; WEAK = prog.WEAK || {}; startSection(prog.idx, prog.endAt); } else { RESULTS = []; WEAK = {}; startSection(0); } };
  if (canResume) $('freshBtn').onclick = () => { store(progKey(), null); RESULTS = []; WEAK = {}; startSection(0); };
}

function drawSteps(){
  $('steps').innerHTML = EXAM.sections.map((s, i) => `<span class="${i === idx ? 'cur' : (RESULTS[i] ? 'done' : '')}">${i + 1}. ${esc(s.title)}</span>`).join('');
}

function startSection(i, resumeEnd){
  idx = i; answers = {}; codeBest = {}; codeIdx = 0;
  hideTip();
  const sec = EXAM.sections[idx];
  $('start').style.display = 'none'; $('report').style.display = 'none'; $('runner').style.display = '';
  $('finishBtn').textContent = T('finishSec'); $('finishBtn').disabled = false;
  $('secTitle').textContent = sec.title;
  drawSteps();
  endAt = resumeEnd && resumeEnd > Date.now() ? resumeEnd : Date.now() + sec.minutes * 60000;
  secStart = endAt - sec.minutes * 60000;   // reconstructed from the deadline, so it survives a page reload
  saveProg();
  clearInterval(tick);
  tick = setInterval(() => {
    const left = endAt - Date.now();
    $('timer').textContent = fmtTime(left); $('timer').classList.toggle('low', left < 120000);
    if (left <= 0) { clearInterval(tick); finishSection(true); }
  }, 500);
  $('timer').textContent = fmtTime(endAt - Date.now());
  if (sec.items.length && sec.items[0].type === 'code') renderCode(); else renderQuestions();
}

/* ---------------- question sections ---------------- */
function renderQuestions(results){
  const sec = EXAM.sections[idx], byKey = {};
  (results ? results.items : []).forEach(r => byKey[r.key] = r);
  $('body').innerHTML = '<div class="card">' + sec.items.map((it, n) => {
    const r = byKey[it.key], lock = results ? 'disabled' : '';
    const badge = it.type === 'mcq' && it.review && it.review !== 'reviewed' ? ` <span class="chip" title="${esc(T('draftHint'))}">${esc(T('draft'))}</span>` : '';
    let h = `<div class="q" data-key="${esc(it.key)}"><div class="cat">${n + 1}. ${esc(it.topic || '')}${badge}</div>`;
    if (it.type === 'mcq') {
      h += `<p><b>${esc(it.q)}</b> <span class="muted">(${esc(T(it.multi ? 'multiHint' : 'singleHint'))})</span></p>` + it.options.map((o, k) => {
        const cls = r ? ((r.expected_index || []).includes(k) ? 'right' : (answers[it.key] && [].concat(answers[it.key]).includes(k) ? 'wrong' : '')) : '';
        const chk = [].concat(answers[it.key] === undefined ? [] : answers[it.key]).includes(k) ? 'checked' : '';
        return `<label class="opt ${cls}"><input type="${it.multi ? 'checkbox' : 'radio'}" name="${esc(it.key)}" value="${k}" ${chk} ${lock}><span>${esc(o)}</span></label>`;
      }).join('');
    } else if (it.type === 'output') {
      h += `<p class="muted">${esc(T('quizHint'))}</p><pre class="qcode"><code>${esc(it.code)}</code></pre><textarea class="qans" style="min-height:56px;height:56px" spellcheck="false" ${lock}>${esc(answers[it.key] || '')}</textarea>`;
    } else {
      h += `<p><b>${esc(it.q)}</b></p><button class="showA" ${lock}>${esc(T('show'))}</button><div class="faceA muted" style="display:${results ? 'block' : 'none'};margin:8px 0">${esc(it.a)}</div>
        <div class="row selfr" style="display:${results ? 'none' : 'none'}"><label><input type="radio" name="${esc(it.key)}" value="know"> ${esc(T('know'))}</label><label><input type="radio" name="${esc(it.key)}" value="dont"> ${esc(T('dont'))}</label></div>`;
    }
    if (r) h += `<div class="qres ${r.correct ? 'ok' : 'err'}">${r.correct ? '✅ ' + esc(T('right')) : '❌ ' + esc(T('wrong'))}${r.correct ? '' : ' — ' + esc(T('expected')) + ': <code>' + esc(r.expected).replace(/\n/g, ' ⏎ ') + '</code>'}${r.explanation ? '<br>' + esc(r.explanation) : ''}${(r.sources || []).length ? '<br><span class="muted">' + esc(T('sourcesLbl')) + ': ' + r.sources.map(s => `<a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a>`).join(' · ') + '</span>' : ''}</div>`;
    return h + '</div>';
  }).join('') + (results ? `<div class="row"><b>${esc(T('score'))}: ${results.score}/${results.max}</b></div>` : '') + '</div>';
  if (!results) {
    $('body').querySelectorAll('.showA').forEach(btn => btn.onclick = () => { const q = btn.closest('.q'); q.querySelector('.faceA').style.display = 'block'; q.querySelector('.selfr').style.display = 'flex'; btn.disabled = true; });
  }
}
function collectAnswers(){
  const out = {};
  $('body').querySelectorAll('.q').forEach(q => {
    const key = q.dataset.key, ta = q.querySelector('textarea.qans');
    if (ta) { out[key] = ta.value; return; }
    const inputs = [...q.querySelectorAll('input')], checked = inputs.filter(i => i.checked);
    if (!inputs.length) return;
    if (inputs[0].type === 'checkbox') out[key] = checked.map(i => Number(i.value));
    else if (checked.length) out[key] = inputs[0].value === 'know' || inputs[0].value === 'dont' ? checked[0].value : Number(checked[0].value);
  });
  return out;
}

/* ---------------- code sections ---------------- */
async function problemFor(id){
  if (!problemCache[id]) problemCache[id] = await api('/api/problems/' + encodeURIComponent(id) + '?lang=' + lang);
  return problemCache[id];
}
async function renderCode(){
  const sec = EXAM.sections[idx], it = sec.items[codeIdx];
  $('body').innerHTML = `<div class="card"><p class="muted">${esc(T('loading'))}</p></div>`;
  let p; try { p = await problemFor(it.id); } catch (e) { return fatal(e.message); }
  const tabs = sec.items.map((x, i) => `<button data-i="${i}" class="${i === codeIdx ? 'primary' : ''}">${esc(T('problem'))} ${i + 1}${codeBest[x.key] ? ' · ' + Math.round(100 * codeBest[x.key].score / codeBest[x.key].max) + '%' : ''}</button>`).join(' ');
  $('body').innerHTML = `<div class="card"><div class="row" style="margin-top:0">${tabs}</div></div>
    <div class="codegrid"><div class="card statement">
      <div class="row" style="margin:0 0 10px"><button id="trBtn"></button><label id="hoverLbl" class="muted"><input type="checkbox" id="hoverChk" style="width:auto"> <span id="hoverTxt"></span></label></div>
      <div id="stmt"></div></div>
    <div><div class="card"><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="code"></textarea>
      <div class="row"><button class="primary" id="submitBtn">${esc(T('submit'))}</button><button id="resetBtn">${esc(T('reset'))}</button><span class="muted" id="status"></span></div></div>
      <div id="result"></div></div></div>`;
  $('body').querySelectorAll('[data-i]').forEach(b => b.onclick = () => { saveDraft(); codeIdx = Number(b.dataset.i); renderCode(); });
  const drawStmt = () => {
    renderStatementInto($('stmt'), p, stmtMode, hoverOn);
    $('trBtn').textContent = stmtMode === 'es' ? T('original') : T('translate'); $('trBtn').disabled = !p.statement_es; $('trBtn').title = p.statement_es ? '' : T('noTr');
    $('hoverLbl').style.display = (stmtMode === 'en' && p.statement_es) ? '' : 'none'; $('hoverTxt').textContent = T('hover'); $('hoverChk').checked = hoverOn;
  };
  drawStmt();
  $('trBtn').onclick = () => { stmtMode = stmtMode === 'es' ? 'en' : 'es'; store('stmtMode', stmtMode); hideTip(); drawStmt(); };
  $('hoverChk').onchange = () => { hoverOn = $('hoverChk').checked; store('hoverOn', hoverOn); drawStmt(); };
  $('code').value = store('draft:' + p.id) || p.starter;
  $('code').addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); const t = e.target, s = t.selectionStart; t.value = t.value.slice(0, s) + '    ' + t.value.slice(t.selectionEnd); t.selectionStart = t.selectionEnd = s + 4; } });
  $('code').addEventListener('input', saveDraft);
  EditorKit.attach($('code'), 'java');          // optional Monaco; silently stays a textarea if not installed
  $('resetBtn').onclick = () => { if (confirm(T('resetConfirm'))) $('code').value = p.starter; };
  $('submitBtn').onclick = async () => {
    saveDraft(); $('submitBtn').disabled = true; $('status').textContent = T('running');
    try { const r = await post('/api/grade', {problem: p.id, code: $('code').value, lang}); recordCode(it.key, r); showCodeResult(r); $('status').textContent = ''; drawSteps(); const tb = $('body').querySelector('[data-i="' + codeIdx + '"]'); if (tb) tb.textContent = T('problem') + ' ' + (codeIdx + 1) + ' · ' + Math.round(100 * codeBest[it.key].score / codeBest[it.key].max) + '%'; }
    catch (e) { $('status').textContent = T('err') + ': ' + e.message; }
    $('submitBtn').disabled = false;
  };
}
function saveDraft(){ const c = $('code'); const it = EXAM.sections[idx].items[codeIdx]; if (c && it) store('draft:' + it.id, c.value); }
function recordCode(key, r){
  const prev = codeBest[key];
  if (prev && r.score <= prev.score) return;
  const cats = {};
  r.tests.forEach(t => { const c = cats[t.category] || (cats[t.category] = {p: 0, n: 0}); c.n++; if (t.passed) c.p++; });
  codeBest[key] = {score: r.score, max: r.max, passed: r.tests.filter(t => t.passed).length, total: r.tests.length, cats};
}
function showCodeResult(r){
  const pct = Math.round(100 * r.score / r.max);
  let h = `<div class="card"><h2>${esc(T('score'))}</h2><div style="font-size:26px;font-weight:800">${r.score}/${r.max} · ${pct}%</div>`;
  if (!r.compile.ok) h += `<p><b>${esc(T('noCompile'))}</b></p><div class="errbox">${esc(r.compile.message)}</div>`;
  h += '<ul class="tests" style="margin-top:12px">' + r.tests.map(t => `<li class="${t.passed ? 'pass' : 'fail'}"><span class="muted">${esc(t.category)} · +${t.points} pts · ${t.ms} ms</span><br>${t.passed ? '✅' : '❌'} ${esc(t.title)}
    ${t.passed ? '' : `<div class="why"><span class="muted">${esc(t.detail)}</span><b>${esc(T('why'))}</b>${esc(t.fail_why)}<b>${esc(T('how'))}</b>${esc(t.fail_how)}</div>`}</li>`).join('') + '</ul></div>';
  $('result').innerHTML = h;
}

/* ---------------- finishing ---------------- */
function timeUsed(sec, auto){
  const used = auto ? sec.minutes : Math.min(sec.minutes, Math.max(0, (Date.now() - secStart) / 60000));
  return {used: Math.round(used * 10) / 10, allotted: sec.minutes};
}
async function finishSection(auto){
  if (!auto && !confirm(T('finishConfirm'))) return;
  clearInterval(tick); $('finishBtn').disabled = true; $('fatal').style.display = 'none';
  const sec = EXAM.sections[idx];
  let rec;
  if (sec.items.length && sec.items[0].type === 'code') {
    saveDraft();
    let s = 0, m = 0, pass = 0, tot = 0; const cats = {};
    const bump = (c, p, n) => { const a = cats[c] || (cats[c] = {p: 0, n: 0}); a.p += p; a.n += n; };
    sec.items.forEach(it => { const b = codeBest[it.key]; if (!b) return; m += b.max; s += b.score; pass += b.passed; tot += b.total; Object.entries(b.cats).forEach(([c, v]) => bump(c, v.p, v.n)); });
    for (const it of sec.items) { if (!codeBest[it.key]) { try { const p = await problemFor(it.id); m += p.tests.reduce((a, t) => a + t.points, 0); tot += p.tests.length; p.tests.forEach(t => bump(t.category, 0, 1)); } catch (e) {} } }
    rec = {module: sec.module, title: sec.title, score: s, max: Math.max(m, 1), pct: m ? s / m : 0, weak: [], done: pass, total: tot, cats, missed: [], ...timeUsed(sec, auto)};
    RESULTS[idx] = rec;
    $('body').innerHTML = `<div class="card"><h3>${esc(T('results'))}</h3><p style="font-size:24px;font-weight:800">${s}/${rec.max} · ${Math.round(100 * rec.pct)}%</p></div>`;
  } else {
    const ans = collectAnswers();
    try {
      const rep = await post('/api/exams/' + encodeURIComponent(EXAM.id) + '/section', {section: idx, answers: ans, lang});
      answers = ans; renderQuestions(rep);
      const byKey = {}; sec.items.forEach(i => { byKey[i.key] = i; });
      const missed = rep.items.filter(r => !r.correct).map(r => { const it = byKey[r.key] || {};
        return {section: sec.title, q: it.q || ((it.topic ? it.topic + ': ' : '') + String(it.code || '').split('\n')[0]), expected: r.expected, explanation: r.explanation, tags: r.tags || [], sources: r.sources || []}; });
      rec = {module: sec.module, title: sec.title, score: rep.score, max: Math.max(rep.max, 1), pct: rep.max ? rep.score / rep.max : 0, weak: rep.weak || [], done: rep.score, total: rep.max, cats: {}, missed, ...timeUsed(sec, auto)};
      RESULTS[idx] = rec; (rep.weak || []).forEach(w => { WEAK[w] = (WEAK[w] || 0) + 1; });
    } catch (e) { $('finishBtn').disabled = false; return fatal(e.message); }   // the answers are still on screen: let the user retry
  }
  if (auto) $('secTitle').textContent = sec.title + ' — ' + T('timeUp');
  drawSteps(); saveProg();
  const last = idx === EXAM.sections.length - 1;
  const nb = document.createElement('div'); nb.className = 'row'; nb.innerHTML = `<button class="primary" id="nextBtn">${esc(last ? T('seeReport') : T('next'))}</button>`;
  $('body').appendChild(nb);
  $('nextBtn').onclick = () => { window.scrollTo(0, 0); if (last) showReport(); else startSection(idx + 1); };
}

function dashFromResults(){
  const secs = EXAM.sections.map((s, i) => { const r = RESULTS[i]; if (!r) return null;
    return {title: r.title || s.title, pct: Math.round(100 * r.pct), done: r.done || 0, total: r.total || 0, used: r.used || 0, allotted: r.allotted || s.minutes}; }).filter(Boolean);
  const done = RESULTS.filter(Boolean);
  const overall = secs.length ? Math.round(secs.reduce((a, s) => a + s.pct, 0) / secs.length) : 0;
  const weak = [];
  secs.filter(s => s.pct < PASS_LINE).forEach(s => weak.push({label: s.title, kind: 'section', pct: s.pct, tip: T('tipSection')}));
  const cats = {};
  done.forEach(r => Object.entries(r.cats || {}).forEach(([c, v]) => { const a = cats[c] || (cats[c] = {p: 0, n: 0}); a.p += v.p; a.n += v.n; }));
  const catInfo = {'Problem solving': ['catPS', 'tipPS'], 'Reliability': ['catRel', 'tipRel'], 'Language knowledge': ['catLang', 'tipLang']};
  Object.entries(cats).filter(([, v]) => v.n > 0).forEach(([c, v]) => { const pct = Math.round(100 * v.p / v.n), info = catInfo[c];
    if (pct < 80 && info) weak.push({label: (lang === 'es' ? 'Código · ' : 'Code · ') + T(info[0]), kind: 'skill', pct, tip: T(info[1])}); });
  Object.entries(WEAK).sort((a, b) => b[1] - a[1]).slice(0, 5).forEach(([tag, n]) => weak.push({label: tag, kind: 'tag', count: n, tip: T('tipTag')}));
  return {sample: false, title: EXAM.title || modeLabel(EXAM.config), subtitle: '· ' + EXAM.total_minutes + ' ' + T('minutes'), overall, sections: secs,
    weak: weak.slice(0, 6), missed: done.flatMap(r => r.missed || [])};
}
let reportSent = false;
async function showReport(){
  if (reportSent) return;            // a double click must not store the same run twice
  reportSent = true;
  hideTip(); window.scrollTo(0, 0);
  clearInterval(tick); $('runner').style.display = 'none'; $('start').style.display = 'none'; $('report').style.display = '';
  const done = RESULTS.filter(Boolean);
  try {
    await post('/api/exams/' + encodeURIComponent(EXAM.id) + '/finish', {
      sections: done.map(r => ({module: r.module, title: r.title, score: Math.round(r.pct * 100), max: 100, pct: Math.round(r.pct * 1000) / 10, correct: r.done, total: r.total, used: r.used, allotted: r.allotted})),
      missed: done.flatMap(r => r.missed || [])});
  } catch (e) {}
  $('report').innerHTML = `<div class="section-head" style="margin:8px auto 26px"><span class="eyebrow">${esc(T('reportTitle'))}</span></div>` + renderDashboard(dashFromResults()) +
    `<div class="row noprint" style="justify-content:center;margin-top:24px"><button class="primary lg" id="retakeBtn">${esc(T('retake'))}</button><a class="btn lg" href="/">${esc(T('another'))}</a><button class="lg" id="printBtn">${esc(T('dPrint'))}</button></div>`;
  store(progKey(), null);
  $('retakeBtn').onclick = () => location.reload();
  $('printBtn').onclick = () => window.print();
}

$('finishBtn').onclick = () => finishSection(false);
(async function init(){
  await renderChrome('home', () => { location.reload(); });
  if (!EID) return fatal(T('notFound'));
  load();
})();
</script>
</body>
</html>
